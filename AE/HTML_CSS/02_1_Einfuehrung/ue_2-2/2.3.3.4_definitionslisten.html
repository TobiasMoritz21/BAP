<!DOCTYPE html>
<html>
	<head>
		<meta charset="ISO-8859-1" />
		<title>Definitionslisten</title>
	</head>
	<!-- Kennzeichnung für Glossare
	dl = definition list (das umfassende Element)
	dt = definition term (der zu erklärende Begriff)
	dd = definition description (Die Erklärung)
	-->
	<body>
		<h1>Webtechnologien</h1>
		<!-- Definitonsliste -->
		<dl>
			<dt>CSS</dt>
			<dd>Cascading Stylesheets</dd>
			<dt>HTML</dt>
			<dd>Hypertext Markup Language</dd>
			<dt>XHTML</dt>
			<dd>eXtensible Hypertext Markup Language</dd>
			<dd>basiert auf XML</dd>
		</dl>
	  
	</body>
</html>
