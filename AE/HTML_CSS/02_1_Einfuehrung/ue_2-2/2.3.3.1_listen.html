<!DOCTYPE html>
<html>
	<head>
		<meta charset="ISO-8859-1" />
		<title>Listen</title>
	</head>
	<!-- 
	ol = ordered list, Nummerierte Listen
	ul = unordered list, Aufzählung ohne Nummerierung
	li = list item
	-->
	<body>
		<ol type="1">
			<li>Telefonate f&uuml;hren</li>
			<li>E-Mails beantworten</li>
			<li>Projekt</li>
		</ol>
		<ul>
			<li>Salat</li>
			<li>Nudeln</li>
			<li>Teddyb&auml;r</li>
		</ul>
	</body>
</html>
