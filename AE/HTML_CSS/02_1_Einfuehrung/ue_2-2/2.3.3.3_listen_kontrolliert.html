<!DOCTYPE html>
<html>
	<head>
		<meta charset="ISO-8859-1" />
		<title>Verschachtelte Listen</title>
	</head>
	<body>
	  <!-- Bei geordneten Listen können Sie die Startnummerierung setzen und bei Listenpunkten eine bestimmte Ordnungsnummer erzwingen. Ferner können Sie eine absteigende Nummerierung anstelle einer aufstei-genden bestimmen. -->
		<ol type="1">
			<li>Henne</li>
			<li>Ei</li>
		</ol>
		<ol start="2" reversed>
			<li>Henne</li>
			<li >Ei</li>
			<li value="2">Hahn</li>
		</ol>
	</body>
</html>
