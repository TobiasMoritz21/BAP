<!DOCTYPE html>
<html>
	<head>
		<meta charset="ISO-8859-1" />
		<title>&Uuml;berschriften</title>
	</head>
	<body>
	<!-- h (header) 
	In xhtml können 6 Ebenen von Überschriften definiert werden.
	Werden diese nicht z.B. über CSS formatiert, unterliegen sie der Interpretation des Browsers
	Überschriften der verschiedenen Ebenen werden standardmäßig fett und in unterschiedlichen Schriftgrößen dargestellt 
	Überschriften können mit hgroup (headergroup) gruppiert werden
	-->
		<hgroup>
			<h1>&Uuml;berschrift der ersten Ebene</h1>
			<h2>&Uuml;berschrift der zweiten Ebene</h2>
			<h3>&Uuml;berschrift der dritten Ebene</h3>
			<h4>&Uuml;berschrift der vierten Ebene</h4>
			<h5>&Uuml;berschrift der f&uuml;nften Ebene</h5>
			<h6>&Uuml;berschrift der sechsten Ebene</h6>
		</hgroup>  
	</body>
</html>
